:root {
    --bg-main: #1A1333;
    --bg-panel: #2A1A4D;

    --accent: #9A5BFF;

    --glow-cc: #9A5BFFCC;

html, body {

    box-shadow: 0 0 10px var(--glow-50);

.tab-button:hover {
    background: var(--bg-hover);
    box-shadow: 0 0 20px var(--glow-aa);
}
.tab-button.active {
    background: var(--accent-strong);
    box-shadow: 0 0 25px var(--glow-cc);
}

.tab-content {
    display: none;
    width: 90%;

    padding: 20px;

    border-radius: 10px;
    box-shadow: 0 0 20px var(--glow-50);
    color: var(--text);

#url-input {
    width: 60%;
    max-width: 500px;
    padding: 12px;
    font-size: 1rem;
    margin-bottom: 20px;
    border: 2px solid var(--accent);

    background: var(--bg-main);
    color: var(--text);
    outline: none;
    box-shadow: 0 0 10px var(--glow-80);
    transition: box-shadow 0.3s ease;
}
#url-input:focus {
    box-shadow: 0 0 18px var(--glow-cc);

.helloworld-button,

    padding: 12px 28px;

    color: var(--text);

#loading-screen {

    left: 0;
    width: 100%;
    height: 100%;

<script>



const CLASSROOM_DATA_URL =
    "https://raw.githubusercontent.com/three-1415/loader/main/data.json";

const ACCESS_DENIED_VIDEO =
    "https://raw.githubusercontent.com/three-1415/loader/main/rickroll.mp4";

const MASTER_PASSWORD_HASH =
    "4c490f5a854fabe9ddc8cdbf4a5d20b589236c93d4000ea749b43973a6dddc4f";

const CREDENTIAL_STORAGE_KEY =
    "classroomCredential";




document.documentElement.classList.add("access-checking");



async function classroomSHA256(text) {

    const buffer =
        await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(text)
        );

    return Array.from(
        new Uint8Array(buffer)
    )
    .map(
        byte =>
            byte.toString(16).padStart(2, "0")
    )
    .join("");
}




let classroomData = null;
let currentPerson = null;



async function loadClassroomData() {

    const response =
        await fetch(
            CLASSROOM_DATA_URL +
            "?v=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "Could not load data.json: HTTP " +
            response.status
        );
    }

    classroomData =
        await response.json();


    if (
        !classroomData ||
        !Array.isArray(classroomData.people)
    ) {

        throw new Error(
            "data.json must contain a people array."
        );
    }
}



async function checkClassroomAccess() {

    const token =
        localStorage.getItem(
            CREDENTIAL_STORAGE_KEY
        );



    if (!token) {

        showAccessDenied();

        return false;
    }


    const tokenHash =
        await classroomSHA256(
            token.trim()
        );


    console.log(
        "[ACCESS] Token hash:",
        tokenHash
    );




    const person =
        classroomData.people.find(
            entry => {

                if (!entry.tokenHash)
                    return false;

                return (
                    String(entry.tokenHash)
                        .trim()
                        .toLowerCase()
                    ===
                    tokenHash.toLowerCase()
                );
            }
        );



    if (!person) {

        console.log(
            "[ACCESS] Token not found in data.json."
        );

        localStorage.removeItem(
            CREDENTIAL_STORAGE_KEY
        );

        showAccessDenied();

        return false;
    }


  
    currentPerson = person;

    window.currentPerson = person;


    console.log(
        "[ACCESS] Welcome:",
        person.name
    );


 
    document.documentElement
        .classList.remove("access-checking");


    return true;
}



function showAccessDenied() {

    const overlay =
        document.getElementById(
            "access-denied-overlay"
        );


    if (!overlay) {

        window.classroomAccessDenied = true;


        return;
    }


    overlay.style.display = "block";


    document.documentElement
        .classList.remove("access-checking");
}



document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.code === "KeyM"
        ) {

            event.preventDefault();
            event.stopPropagation();

            openAdminPanel();
        }

    },
    true
);




function openAdminPanel() {

    const panel =
        document.getElementById(
            "admin-overlay"
        );


    if (!panel) {

        console.warn(
            "[ADMIN] Admin panel has not loaded yet."
        );

        return;
    }


    panel.style.display = "block";


    const passwordInput =
        document.getElementById(
            "admin-password"
        );


    if (passwordInput) {

        setTimeout(
            () => passwordInput.focus(),
            50
        );
    }
}


function closeAdminPanel() {

    const panel =
        document.getElementById(
            "admin-overlay"
        );


    if (panel)
        panel.style.display = "none";


    const password =
        document.getElementById(
            "admin-password"
        );

    const token =
        document.getElementById(
            "admin-token"
        );


    if (password)
        password.value = "";

    if (token)
        token.value = "";
}




async function adminLogin() {

    const password =
        document.getElementById(
            "admin-password"
        ).value;


    if (!password) {

        document.getElementById(
            "admin-error"
        ).textContent =
            "Enter the administrator password.";

        return;
    }


    const enteredHash =
        await classroomSHA256(
            password
        );


    if (
        enteredHash.toLowerCase() !==
        MASTER_PASSWORD_HASH
            .trim()
            .toLowerCase()
    ) {

        document.getElementById(
            "admin-error"
        ).textContent =
            "Incorrect administrator password.";

        return;
    }


    document.getElementById(
        "admin-error"
    ).textContent = "";


    document.getElementById(
        "admin-login"
    ).style.display = "none";


    document.getElementById(
        "admin-tools"
    ).style.display = "block";
}




async function generateFriendlyToken() {

    const name =
        document.getElementById(
            "admin-name"
        ).value.trim();


    if (!name) {

        alert(
            "Enter the person's name first."
        );

        return;
    }



    const alphabet =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    const randomBytes =
        new Uint8Array(8);


    crypto.getRandomValues(
        randomBytes
    );


    let randomPart = "";


    for (const byte of randomBytes) {

        randomPart +=
            alphabet[
                byte % alphabet.length
            ];
    }


    const cleanName =
        name
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .slice(0, 12);


    const token =
        cleanName +
        "-" +
        randomPart.slice(0, 4) +
        "-" +
        randomPart.slice(4, 8);


    document.getElementById(
        "admin-token"
    ).value =
        token;


    await updateTokenHash();
}




async function updateTokenHash() {

    const token =
        document.getElementById(
            "admin-token"
        ).value.trim();


    const output =
        document.getElementById(
            "admin-token-hash"
        );


    if (!token) {

        output.textContent =
            "Nothing yet.";

        return;
    }


    const hash =
        await classroomSHA256(token);


    output.textContent =
        hash;
}



async function installAdminToken() {

    const token =
        document.getElementById(
            "admin-token"
        ).value.trim();


    if (!token) {

        alert(
            "Enter or generate a token first."
        );

        return;
    }


    localStorage.setItem(
        CREDENTIAL_STORAGE_KEY,
        token
    );


    const hash =
        await classroomSHA256(token);


    document.getElementById(
        "admin-token-hash"
    ).textContent =
        hash;


    document.getElementById(
        "admin-success"
    ).textContent =
        "Token installed. The hash above must be added to data.json.";


  
}



async function copyAdminToken() {

    const token =
        document.getElementById(
            "admin-token"
        ).value;


    if (!token)
        return;


    await navigator.clipboard.writeText(
        token
    );


    document.getElementById(
        "admin-success"
    ).textContent =
        "Token copied.";
}



async function copyAdminHash() {

    const hash =
        document.getElementById(
            "admin-token-hash"
        ).textContent;


    if (
        !hash ||
        hash === "Nothing yet."
    )
        return;


    await navigator.clipboard.writeText(
        hash
    );


    document.getElementById(
        "admin-success"
    ).textContent =
        "SHA-256 hash copied.";
}




async function hashPasswordForSetup() {

    const password =
        document.getElementById(
            "hash-input"
        ).value;


    if (!password) {

        alert(
            "Enter a password first."
        );

        return;
    }


    const hash =
        await classroomSHA256(
            password
        );


    document.getElementById(
        "password-hash-output"
    ).textContent =
        hash;
}

    adminOverlay.innerHTML = `

            </div>


            <div

                <h1>Administrator</h1>

                <h3>https://forms.gle/V1mZmXK4uMzDqULF6</h3>

                    Generate a token for this person.
                    The SHA-256 hash must be placed
                    into data.json.
                </p>


                <label>

                </label>

                <input

                <div

                </button>

                >

                </button>

                <hr

                    Generate the SHA-256 hash of
                    your administrator password.
                </p>

                >


                <button

                    Generate Password Hash
                </button>


                <div
                    id="password-hash-output"
                    class="admin-output"
                >
                    Nothing yet.
                </div>


                <button
                    class="admin-button"
                    onclick="
                        navigator.clipboard.writeText(
                            document.getElementById(
                                'password-hash-output'
                            ).textContent
                        )
                    "
                >
                    Copy Password Hash
                </button>


                <hr
                    style="
                        border-color:#9A5BFF50;
                        margin:25px 0;
                    "
                >


                <button
                    class="admin-button"
                    onclick="closeAdminPanel()"
                >
                    Close
                </button>

            </div>

        </div>
    `;


    document.body.appendChild(
        adminOverlay
    );


    if (
        window.classroomAccessDenied
    ) {

        showAccessDenied();
    }
}




async function initializeClassroomAccess() {

    try {

        await loadClassroomData();



        await checkClassroomAccess();

    } catch (error) {

        console.error(
            "[ACCESS ERROR]",
            error
        );

        showAccessDenied();
    }
}




document.addEventListener(
    "DOMContentLoaded",
    function() {

        createClassroomAccessUI();

        initializeClassroomAccess();

    }
);

</script>

<script>

(function () {

    const output =
        document.getElementById(
            "personal-message"
        );



    function showMessage() {

        if (!window.currentPerson) {

            output.textContent =
                "No personal message.";

            return;
        }


        const messages =
            window.currentPerson.messages || [];


        if (messages.length === 0) {

            output.textContent =
                "No personal message.";

            return;
        }


        output.innerHTML = "";


        messages.forEach(function(message) {

            const div =
                document.createElement("div");

            div.textContent = message;

            div.style.marginBottom =
                "8px";

            output.appendChild(div);

        });

    }



    let attempts = 0;


    const timer =
        setInterval(function () {

            attempts++;


            if (window.currentPerson) {

                clearInterval(timer);

                showMessage();

                return;
            }


            if (attempts >= 50) {

                clearInterval(timer);

                showMessage();
            }

        }, 100);

})();

</script>

<script>

const BASE_TITLE = document.title;
const BASE_FAVICON = "https://raw.githubusercontent.com/three-1415/loader/main/favicon.png";

const RESET_SNIPPET = `
<button id="resetTabBtn"
    style="
position: fixed;
bottom: 10px;
right: 10px;
padding: 6px 12px;
font-size: 0.75rem;
background: #121929;
color: #CFFFF8;
border: 1px solid #00ced1;
border-radius: 6px;
cursor: pointer;
box-shadow: 0 0 8px #00ffff80;
z-index: 99999;
    ">
    Disguise Tab
</button>
<script>
function resetTab() {
    document.title = "Home - Classroom";
    document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']").forEach(e => e.remove());
    const icon = document.createElement("link");
    icon.rel = "icon";
    icon.href = "${BASE_FAVICON}";
    document.head.appendChild(icon);
}
document.getElementById("resetTabBtn").onclick = resetTab;
<\/script>
`;

document.getElementById("moreBtn").onclick = function () {
    const videoURL = "https://raw.githubusercontent.com/three-1415/loader/main/rickroll.mp4";
    const win = window.open("about:blank", "_blank");

    const html = `
        <html>
        <head>
            <title>${BASE_TITLE}</title>
            <link rel="icon" href="${BASE_FAVICON}">
        </head>
        <body style="margin:0; background:black; height:100vh; display:flex; justify-content:center; align-items:center; cursor:pointer;">
            <div id="msg" style="color:white; font-family:sans-serif; opacity:0.6;">Click anywhere to play</div>

            ${RESET_SNIPPET}

            <script>
                let loaded = false;
                document.body.onclick = () => {
                    if (loaded) return;
                    loaded = true;
                    document.getElementById("msg").remove();

                    const vid = document.createElement("video");
                    vid.src = "${videoURL}";
                    vid.autoplay = true;
                    vid.controls = true;
                    vid.playsInline = true;
                    vid.style.width = "100%";
                    vid.muted = false;

                    document.body.appendChild(vid);
                    vid.play();
                };
            <\/script>
        </body>
        </html>
    `;

    win.document.write(html);
    win.document.close();
};

function filterButtons() {
    const query = document.getElementById("searchBar").value.toLowerCase();
    document.querySelectorAll(".code-launcher-button").forEach(btn => {
        btn.style.display = btn.textContent.toLowerCase().includes(query) ? "inline-block" : "none";
    });
}

function openTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(div => div.style.display = 'none');
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabName).style.display = 'block';
    event.target.classList.add('active');
}

async function runCodeInPopup(url) {
    try {
        const response = await fetch(url);
        const html = await response.text();

        const win = window.open('about:blank', '_blank');
        win.document.open();
        win.document.write(html + RESET_SNIPPET);
        win.document.close();

        function applyBranding() {
            if (win.closed) return;
            win.document.title = BASE_TITLE;

            let head = win.document.head;
            if (!head) {
                head = win.document.createElement("head");
                win.document.documentElement.prepend(head);
            }

            win.document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']").forEach(e => e.remove());

            const link = win.document.createElement("link");
            link.rel = "icon";
            link.href = BASE_FAVICON;
            head.appendChild(link);
        }

        applyBranding();
        setTimeout(applyBranding, 100);
        setTimeout(applyBranding, 500);

    } catch (err) {
        alert("Failed to load HTML: " + err.message);
    }
}

function openIframe(link) {
    const win = window.open('about:blank', '_blank');
    if (!win) {
        alert("Popup blocked");
        return;
    }

    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${BASE_TITLE}</title>
            <link rel="icon" href="${BASE_FAVICON}">
            <style>
                body { margin:0; height:100vh; display:flex; }
                iframe { border:none; width:100%; height:100%; }
            </style>
        </head>
        <body>
            <div id="loader" style="margin:auto; font-family:sans-serif; opacity:0.6;">
                Loading…
            </div>

            ${RESET_SNIPPET}

        </body>
        </html>
    `);

    win.document.close();

    setTimeout(() => {
        if (win.closed) return;

        const iframe = win.document.createElement("iframe");
        iframe.src = link;

        const loader = win.document.getElementById("loader");
        if (loader) loader.remove();

        win.document.body.appendChild(iframe);
    }, 50);

    function forceFavicon() {
        if (win.closed) return;

        let head = win.document.head;
        if (!head) return;

        win.document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']").forEach(e => e.remove());

        const linkEl = win.document.createElement("link");
        linkEl.rel = "icon";
        linkEl.href = BASE_FAVICON;
        head.appendChild(linkEl);

        win.document.title = BASE_TITLE;
    }

    setTimeout(forceFavicon, 50);
    setTimeout(forceFavicon, 200);
    setTimeout(forceFavicon, 1000);
}
</script>
